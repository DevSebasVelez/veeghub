<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sin conexión · Veeghub</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #e5e5e5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 2rem env(safe-area-inset-right, 1rem) env(safe-area-inset-bottom, 2rem) env(safe-area-inset-left, 1rem);
        text-align: center;
        gap: 1.5rem;
      }
      .logo {
        width: 64px;
        height: 64px;
        background: #1c1c1c;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #2a2a2a;
      }
      h1 { font-size: 1.5rem; font-weight: 600; }
      p { color: #888; font-size: 0.95rem; max-width: 280px; line-height: 1.5; }
      button {
        margin-top: 0.5rem;
        padding: 0.65rem 1.5rem;
        background: #e5e5e5;
        color: #0a0a0a;
        border: none;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="logo">
      <svg width="36" height="36" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 9 L16 22 L24 9" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Sin conexión</h1>
    <p>Veeghub requiere conexión a internet. Verifica tu red e intenta de nuevo.</p>
    <button onclick="window.location.reload()">Reintentar</button>
  </body>
</html>
